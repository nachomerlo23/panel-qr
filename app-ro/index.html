<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dirección · Qué Cuándo Cómo</title><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--mut:#6b7280;--line:#e5e7eb;--blue:#2f6fec;--red:#d9373e;--green:#17845b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{max-width:820px;margin:auto;padding:24px 16px 100px}header,.hero,.head,.mainrow,.actions,.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:28px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800}.brand h1{font-size:19px;margin:0}.brand p{margin:3px 0 0;color:var(--mut);font-size:12px}button,input,textarea{font:inherit}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.hero h2{font-size:34px;margin:0 0 7px}.hero p{margin:0;color:var(--mut)}section{margin-top:26px}.head{margin:0 2px 10px}.title{font-size:13px;font-weight:850;letter-spacing:.07em;text-transform:uppercase;color:#4b5563}.danger .title{color:var(--red)}.count{font-size:11px;border-radius:999px;padding:3px 7px;background:#e9edf4;margin-left:6px}.task{background:var(--card);border:1px solid var(--line);border-radius:17px;margin:9px 0;overflow:hidden}.task.late{border-color:#efb5b8}.mainrow{width:100%;border:0;background:none;padding:16px;text-align:left;cursor:pointer}.what{font-weight:780}.when{color:var(--mut);font-size:13px;margin-top:5px}.late .when{color:var(--red);font-weight:700}.meta{color:var(--mut);font-size:12px;white-space:nowrap}.body{display:none;border-top:1px solid var(--line);padding:13px 16px 16px;background:#fafbfc}.task.open .body{display:block}.task.open .chev{transform:rotate(180deg)}.step{display:flex;gap:10px;align-items:flex-start;padding:5px 0}.step input{width:20px;height:20px;accent-color:var(--green);margin:0}.step.done span{text-decoration:line-through;color:#9299a6}.actions{justify-content:flex-start;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}.small{font-size:12px;padding:8px 10px}.red{color:var(--red)}.day{font-size:14px;color:var(--mut);font-weight:700;margin:17px 2px 7px}.empty{padding:18px;border:1px dashed #d3d9e2;border-radius:15px;color:var(--mut);text-align:center;background:#ffffff80}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#fffffff2;border:1px solid var(--line);padding:5px;border-radius:15px;box-shadow:0 10px 30px #0002}.nav button{border:0;background:none;padding:9px 13px;border-radius:10px;font-weight:750;color:#687386}.nav button.on{background:#edf3ff;color:var(--blue)}.overlay{position:fixed;inset:0;background:#0f172a55;display:none;align-items:flex-end;justify-content:center;padding:15px;z-index:30}.overlay.show{display:flex}.sheet{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:19px}.sheet h3{margin:0 0 16px}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:#606979;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #d8dde5;border-radius:11px;padding:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.capture{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.capture button{padding:12px 7px}.capture button.on{outline:3px solid #e6eeff;border-color:var(--blue)}.sourcebox{padding:12px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;margin-top:10px}.preview{max-width:100%;max-height:150px;border-radius:10px;margin-top:8px}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.history{display:none}.hist{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin:9px 0}.hist b{display:block}.hist small{color:var(--mut)}@media(max-width:620px){.hero h2{font-size:29px}.row,.capture{grid-template-columns:1fr}.brand p{display:none}}</style></head><body><div class="app"><header><div class="brand"><div class="logo">D</div><div><h1>Dirección</h1><p>Qué · Cuándo · Cómo</p></div></div><button class="btn" id="reset">↻</button></header><main id="home"><div class="hero"><div><h2>Buen día.</h2><p id="todaylabel"></p></div><button class="btn primary" id="new">+ Nuevo</button></div><div id="sections"></div></main><main class="history" id="history"><div class="hero"><div><h2>Historial</h2><p>Completadas, canceladas y reprogramadas.</p></div></div><div id="histlist"></div></main></div><div class="nav"><button class="on" data-view="home">Hoy</button><button data-view="history">Historial</button></div><div class="overlay" id="sheet"><div class="sheet"><h3>Nueva tarea</h3><div class="capture"><button class="btn on" data-cap="text">✍️ Escribir</button><button class="btn" data-cap="voice">🎙 Grabar</button><button class="btn" data-cap="photo">📷 Foto</button></div><div class="sourcebox" id="sourceText">Podés escribir la fuente o indicación y completar la ficha.</div><div class="sourcebox" id="sourceVoice" hidden><button class="btn" id="record">● Grabar audio</button><div id="recstatus" style="margin-top:8px;color:#6b7280;font-size:13px"></div><audio id="player" controls hidden style="width:100%;margin-top:9px"></audio></div><div class="sourcebox" id="sourcePhoto" hidden><input type="file" id="photo" accept="image/*"><img id="img" class="preview" hidden></div><div class="field"><label>Qué</label><input id="what" placeholder="Ej: Presentar POFA"></div><div class="row"><div class="field"><label>Cuándo</label><input type="date" id="date"></div><div class="field"><label>Hora opcional</label><input type="time" id="time"></div></div><div class="field"><label>Cómo</label><textarea id="hows" placeholder="Una acción por línea"></textarea></div><div class="footer"><button class="btn" id="close">Cancelar</button><button class="btn primary" id="save">Guardar</button></div></div></div><script>(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],KEY='app-ro-live-v1',open=new Set;const iso=d=>d.toISOString().slice(0,10),day=n=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return iso(d)},seed=()=>({n:6,t:[{id:1,w:'Enviar planilla de matrícula',d:day(-2),tm:'',s:'pending',h:[['Revisar datos',1],['Enviar por correo',0]]},{id:2,w:'Reunión con inspectora',d:day(0),tm:'10:30',s:'pending',h:[['Llevar cuaderno institucional',0],['Anotar acuerdos',0]]},{id:3,w:'Presentar POFA',d:day(0),tm:'',s:'pending',h:[['Completar formulario',1],['Imprimir dos copias',0],['Llevar a Jefatura',0]]},{id:4,w:'Actualizar legajos',d:day(1),tm:'',s:'pending',h:[['Revisar documentación faltante',0]]},{id:5,w:'Cierre de comedor',d:day(3),tm:'',s:'pending',h:[['Completar planilla',0],['Guardar copia',0]]}]});let st=JSON.parse(localStorage.getItem(KEY)||'null')||seed();const save=()=>{localStorage.setItem(KEY,JSON.stringify(st));render()};const fmt=d=>new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long'}).format(new Date(d+'T12:00:00'));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function card(t,late=false){let done=t.h.filter(x=>x[1]).length;return `<article class="task ${late?'late':''} ${open.has(t.id)?'open':''}"><button class="mainrow" data-toggle="${t.id}"><div><div class="what">${esc(t.w)}</div><div class="when">${late?'Vencía ':''}${fmt(t.d)}${t.tm?' · '+t.tm:''}</div></div><div class="meta">${done}/${t.h.length} <span class="chev">⌄</span></div></button><div class="body"><div>${t.h.map((x,i)=>`<label class="step ${x[1]?'done':''}"><input type="checkbox" data-check="${t.id}" data-i="${i}" ${x[1]?'checked':''}><span>${esc(x[0])}</span></label>`).join('')}</div><div class="actions"><button class="btn small" data-re="${t.id}">↻ Reprogramar</button><button class="btn small red" data-ca="${t.id}">Cancelar</button></div></div></article>`}function render(){let now=day(0),end=day(6-new Date().getDay()),active=st.t.filter(x=>x.s==='pending'),late=active.filter(x=>x.d<now),tod=active.filter(x=>x.d===now),week=active.filter(x=>x.d>now&&x.d<=end).sort((a,b)=>(a.d+a.tm).localeCompare(b.d+b.tm));$('#todaylabel').textContent=new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());let out='';if(late.length)out+=`<section class="danger"><div class="head"><div class="title">Atrasados <span class="count">${late.length}</span></div></div>${late.map(x=>card(x,true)).join('')}</section>`;out+=`<section><div class="head"><div class="title">Hoy <span class="count">${tod.length}</span></div></div>${tod.length?tod.map(x=>card(x)).join(''):'<div class="empty">No hay tareas para hoy.</div>'}</section>`;out+=`<section><div class="head"><div class="title">Esta semana <span class="count">${week.length}</span></div></div>`;let last='';for(const x of week){if(x.d!==last){last=x.d;out+=`<div class="day">${fmt(x.d)}</div>`}out+=card(x)}out+=week.length?'':'<div class="empty">No hay más tareas esta semana.</div>';out+='</section>';$('#sections').innerHTML=out;bind();history()}function bind(){$$('[data-toggle]').forEach(b=>b.onclick=()=>{let id=+b.dataset.toggle;open.has(id)?open.delete(id):open.add(id);render()});$$('[data-check]').forEach(c=>c.onchange=e=>{e.stopPropagation();let t=st.t.find(x=>x.id==c.dataset.check);t.h[+c.dataset.i][1]=c.checked?1:0;if(t.h.every(x=>x[1])){t.s='completed';t.doneAt=new Date().toISOString();let r=prompt('Tarea completada. Referencia opcional (texto, link o descripción de foto/audio):','');if(r)t.ref=r}save()});$$('[data-re]').forEach(b=>b.onclick=()=>{let t=st.t.find(x=>x.id==b.dataset.re),nd=prompt('Nueva fecha (AAAA-MM-DD):',t.d);if(!nd)return;let why=prompt('¿Por qué se reprograma? (opcional)','')||'';st.t.push({...t,id:st.n++,s:'rescheduled',reason:why,newDate:nd});t.d=nd;t.h=t.h.map(x=>[x[0],0]);save()});$$('[data-ca]').forEach(b=>b.onclick=()=>{let t=st.t.find(x=>x.id==b.dataset.ca);if(!confirm('¿Cancelar esta tarea?'))return;t.s='cancelled';t.reason=prompt('Motivo de cancelación (opcional)','')||'';save()})}function history(){let a=st.t.filter(x=>x.s!=='pending').slice().reverse();$('#histlist').innerHTML=a.length?a.map(x=>`<div class="hist"><b>${esc(x.w)}</b><small>${x.s==='completed'?'Completada':x.s==='cancelled'?'Cancelada':'Reprogramada'} · ${fmt(x.d)}${x.reason?' · '+esc(x.reason):''}${x.ref?'<br>Referencia: '+esc(x.ref):''}</small></div>`).join(''):'<div class="empty">Todavía no hay historial.</div>'}$('#new').onclick=()=>{$('#sheet').classList.add('show');$('#date').value=day(0)};$('#close').onclick=()=>$('#sheet').classList.remove('show');$('#save').onclick=()=>{let w=$('#what').value.trim(),d=$('#date').value,h=$('#hows').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!w||!d||!h.length)return alert('Completá QUÉ, CUÁNDO y al menos un CÓMO.');st.t.push({id:st.n++,w,d,tm:$('#time').value,s:'pending',h:h.map(x=>[x,0])});$('#sheet').classList.remove('show');$('#what').value='';$('#hows').value='';save()};$$('[data-cap]').forEach(b=>b.onclick=()=>{$$('[data-cap]').forEach(x=>x.classList.toggle('on',x===b));$('#sourceText').hidden=b.dataset.cap!=='text';$('#sourceVoice').hidden=b.dataset.cap!=='voice';$('#sourcePhoto').hidden=b.dataset.cap!=='photo'});let rec,stream,chunks=[];$('#record').onclick=async()=>{if(rec&&rec.state==='recording'){rec.stop();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:rec.mimeType}),url=URL.createObjectURL(blob);$('#player').src=url;$('#player').hidden=false;$('#recstatus').textContent='Audio grabado. Podés escucharlo antes de guardar.';stream.getTracks().forEach(t=>t.stop());$('#record').textContent='● Grabar de nuevo'};rec.start();$('#record').textContent='■ Detener';$('#recstatus').textContent='Grabando…'}catch(e){$('#recstatus').textContent='El navegador no permitió usar el micrófono.'}};$('#photo').onchange=e=>{let f=e.target.files[0];if(!f)return;$('#img').src=URL.createObjectURL(f);$('#img').hidden=false};$$('.nav button').forEach(b=>b.onclick=()=>{let v=b.dataset.view;$('#home').style.display=v==='home'?'block':'none';$('#history').style.display=v==='history'?'block':'none';$$('.nav button').forEach(x=>x.classList.toggle('on',x===b));history()});$('#reset').onclick=()=>{if(confirm('¿Restablecer demo?')){st=seed();localStorage.setItem(KEY,JSON.stringify(st));open.clear();render()}};render()})();</script></body></html>
